<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15100a">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Legion Royale">
  <title>Legion Royale</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6714952192107227"
       crossorigin="anonymous"></script>
  <script type="module" crossorigin src="/assets/index-CjmPVZO3.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CmKqm-vj.css">
</head>
<body>
  <!-- Het spel vult het hele scherm; de stage blijft binnen de veilige zone (notch, browserbalken). -->
  <div id="game"><div id="stage"></div></div>

  <!-- Telefoon rechtop: het spel is altijd liggend. -->
  <div id="rotate" aria-live="polite">
    <div class="rotate-phone"></div>
    <p>Rotate your device<br><small>Landscape mode required</small></p>
  </div>

  <!-- Laadscherm: logo verschijnt meteen (zoals bij Relic Slide) en blijft tot alle art geladen is. Tik = overslaan zodra klaar. -->
  <div id="splash" aria-hidden="true">
    <img src="assets/art/logo.webp?v=09dcffd" alt="" width="1200" height="675">
    <div class="splash-bar"><span></span></div>
  </div>
  <script>
    (() => {
      const el = document.getElementById('splash'), bar = el.querySelector('span');
      let seen = false; try { seen = !!sessionStorage.getItem('lr-intro'); sessionStorage.setItem('lr-intro', '1'); } catch (e) {}
      const minUntil = performance.now() + (seen ? 500 : 2200);
      let loaded = false, closed = false;
      const close = () => { if (closed || !loaded) return; closed = true; el.classList.add('out'); setTimeout(() => el.remove(), 600); };
      el.addEventListener('click', close);
      window.__splash = {
        progress: p => { bar.style.width = Math.round(p * 100) + '%'; },
        done: () => { loaded = true; bar.style.width = '100%'; setTimeout(close, Math.max(0, minUntil - performance.now())); },
      };
    })();
  </script>

  <!-- Onder het spel: uitleg en advertentie, nooit over het speelveld heen. -->
  <section class="below">
    <h1>Legion Royale</h1>
    <p>Choose a card and deploy it on a lane. Defend your towers and capture the enemy castle.</p>
    <div class="ad">
      <!-- Legion Royale -->
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-6714952192107227"
           data-ad-slot="5235283178"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>
           (adsbygoogle = window.adsbygoogle || []).push({});
      </script>
    </div>
  </section>
  <script>
    // Installeren (PWA): Android/desktop-Chrome geven een installatievraag die het menu kan tonen.
    window.__install = { prompt: null };
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__install.prompt = e; });
    addEventListener('appinstalled', () => { window.__install.prompt = null; window.__install.done = true; });
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
