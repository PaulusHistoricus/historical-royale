name: Account database
on:
  pull_request:
    paths:
      - 'database/**'
      - 'public/api/**'
      - 'tests/api/**'
      - 'tests/database-schema.sh'
      - '.github/workflows/account-database.yml'
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'public/api/**'
      - 'tests/api/**'
      - 'tests/database-schema.sh'
      - '.github/workflows/account-database.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Validate install, retry and migration
        run: bash tests/database-schema.sh docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create API test user
        run: |
          docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot -e "CREATE USER IF NOT EXISTS 'lr'@'%' IDENTIFIED BY 'lrpass'; GRANT ALL ON lr_api_test.* TO 'lr'@'%';"
      - name: PHP API integration tests
        env:
          LR_DB: docker exec -i ${{ job.services.mariadb.id }} mariadb -uroot
          LR_DB_DSN: 127.0.0.1:3306:lr:lrpass
        run: php -v && node --test tests/api/api.test.mjs
