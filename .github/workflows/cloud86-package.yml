name: Cloud86 public-private ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloud86-package.yml'
      - 'src/**'
      - 'public/**'
      - 'private/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for Cloud86 subdomain root
        run: npx vite build --base=/
      - name: Package public and private folders
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/version.json
          test -d dist/assets
          if grep -q '/historical-royale/' dist/index.html; then
            echo 'Wrong base URL for Cloud86' >&2
            exit 1
          fi
          mkdir -p cloud86-package/public cloud86-package/private
          cp -a dist/. cloud86-package/public/
          test -f cloud86-package/public/.htaccess
          cp private/legionroyale.example.php cloud86-package/private/legionroyale.example.php
          cat > cloud86-package/private/README.txt <<'EOF'
          LEGION ROYALE - PRIVATE CONFIGURATION
          Before login works, create a file named legionroyale.php
          in this PRIVATE folder by copying legionroyale.example.php.
          Replace placeholders with the real database and Google OAuth credentials.
          NEVER upload private/ into httpdocs or place real secrets on GitHub.
          See docs/auth-deployment.md in the source repository.
          EOF
          cat > cloud86-package/UPLOAD-INSTRUCTIES.txt <<'EOF'
          LEGION ROYALE - CLOUD86 / PLESK

          Deploy to https://legionroyale.paulushistoricus.nl/

          1. Upload the CONTENTS of public/ to the subdomain httpdocs/ folder,
             replacing the previous index.html, assets/ and api/ files.
          2. Put private/ NEXT TO httpdocs, NEVER INSIDE it.
          3. Inside the server's private/ folder create legionroyale.php using
             legionroyale.example.php as a template. Set REAL credentials there.
             There is no sensitive secret in this downloadable ZIP.
          4. Import database/schema.sql in Plesk phpMyAdmin. The schema is
             in the GitHub repository, not in this public web folder.
          5. Create an OAuth Web client in Google Cloud:
             Redirect URI (exact):
             https://legionroyale.paulushistoricus.nl/api/google-callback.php
          6. Check https://legionroyale.paulushistoricus.nl/api/me.php
             returns JSON, not downloadable PHP code.
          7. See docs/auth-deployment.md for full installation and safety notes.

          Google login is NOT ACTIVE until database, configuration and
          Google OAuth consent screen are set up.
          The game currently plays against AI; PvP WebSockets are NOT live.

          Source: github.com/PaulusHistoricus/historical-royale
          EOF
      - name: Upload ready-to-place Cloud86 package
        uses: actions/upload-artifact@v4
        with:
          name: legionroyale-cloud86-public-private
          path: cloud86-package/
          if-no-files-found: error
          include-hidden-files: true   # .htaccess (cache-instellingen) moet mee
          retention-days: 30
